name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npx nx lint extension

      - name: Test extension
        run: npx nx test extension

      - name: Build extension
        run: npx nx build extension

      - name: Package extension
        run: |
          cd apps/extension/dist
          zip -r ../../../inbox-zen-extension-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: inbox-zen-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
