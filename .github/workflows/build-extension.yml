name: Build Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npx nx build extension

      - name: Package extension (ZIP to CRX)
        run: |
          cd apps/extension/dist
          zip -r ../../../inbox-zen-extension.zip .
          cd ../../../
          mv inbox-zen-extension.zip inbox-zen-extension.crx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inbox-zen-extension
          path: inbox-zen-extension.crx
